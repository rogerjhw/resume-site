<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Stak3holder Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Same type system and palette as the matchup overlay, so the two
       compose as one visual language rather than two different tools. */
    --text: #14151a;
    --text-dim: #6b6b66;
    --up: #3f8a4b;
    --down: #c0392b;
    --sans: "Space Grotesk", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* Transparent background is required for OBS compositing — do not set a color here. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  #ticker-bar {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: var(--ticker-height, 64px);
    background: transparent;
    display: flex;
    align-items: center;
    font-family: var(--sans);
    box-sizing: border-box;
  }


  #tape-viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #tape-track {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform;
  }

  .conf-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 100%;
    padding: 0 18px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: var(--text);
    background: rgba(0, 0, 0, 0.05);
    border-right: 1px solid rgba(0, 0, 0, 0.12);
    flex: 0 0 auto;
  }
  .conf-label img.conf-logo {
    width: 22px;
    height: 22px;
    object-fit: contain;
    flex: 0 0 auto;
  }

  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 100%;
    padding: 0 16px;
    flex: 0 0 auto;
    border-right: 1px solid rgba(0, 0, 0, 0.08);
  }

  .ticker-item img.logo {
    width: 28px;
    height: 28px;
    object-fit: contain;
    flex: 0 0 auto;
  }
  .ticker-item .logo-fallback {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e2e5eb;
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .ticker-item .symbol {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .ticker-item .price {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .ticker-item .delta {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .ticker-item .delta.up { color: var(--up); }
  .ticker-item .delta.down { color: var(--down); }
  .ticker-item .delta.flat { color: var(--text-dim); }

  #debug-panel {
    position: fixed;
    top: 16px;
    left: 16px;
    max-width: 480px;
    background: rgba(0,0,0,0.85);
    color: #d8ffea;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    padding: 10px 12px;
    border-radius: 6px;
    white-space: pre-wrap;
    z-index: 10;
  }
  #debug-panel .warn { color: #fbbf24; }
  #debug-panel .err { color: #f87171; }
</style>
</head>
<body>

<div id="ticker-bar">
  <div id="tape-viewport">
    <div id="tape-track"></div>
  </div>
</div>
<div id="debug-panel" style="display:none;"></div>

<script>
/* ============================================================
   1. CONFIG
   ============================================================ */
const qs = new URLSearchParams(location.search);

  // px/sec scroll speed
  SPEED: Number(qs.get('speed')) || 70,
  // "alltime" | "session" — which delta is rendered
  CHANGE_BASIS: qs.get('basis') === 'session' ? 'session' : 'alltime',
  // "price" (cheapest first, default) | "symbol"
  SORT: qs.get('sort') === 'symbol' ? 'symbol' : 'price',

// Normalizes conference string variants to the canonical CONFERENCE_ORDER strings.
// Currently a no-op against real data (cfb-config.json already uses the canonical

// the adapter degrades gracefully if the catalog is ever regenerated differently.
function normalizeConference(raw) {
  if (!raw) return raw;
  const map = {
    'b1g': 'Big Ten', 'big 10': 'Big Ten',
    'sec': 'SEC',
    'acc': 'ACC',
    'big12': 'Big 12', 'big 12': 'Big 12',
  };
  return map[raw.trim().toLowerCase()] || raw;
}

/* ============================================================
   2. ADAPTER
   ------------------------------------------------------------
   Maps a raw /tokens response (see stakeholderIndexerApi.ts /
   TokensResponseSchema) to the shape the ticker renders:
   { symbol, price, conference, logo, allTimeChange }.

   Real endpoint: GET {INDEXER_BASE}/tokens?chainId=42161&limit=200&offset=0&market=cfb
   Auth: none — this route takes no header/token (verified against the
   app's own axios client, which sends none). Not paginated in practice:
   the app always requests all teams for a market in one call.
   Field names below (price, address, market, changes) are the real
   TokenWithChangesSchema fields, not a guess.
   ============================================================ */
function mapApiResponse(json) {
  const tokens = Array.isArray(json?.tokens) ? json.tokens : [];
  const out = [];

  for (const tok of tokens) {
    const address = String(tok.address || '').toLowerCase();
    const team = TEAM_BY_ADDRESS.get(address);
    if (!team) continue; // not one of the four target conferences, or unknown token

    const price = Number(tok.price) / 1e6; // USDC wei, 6 decimals
    if (!Number.isFinite(price)) continue;

    const basePrice = team.launchPrice / 1e6;
    const allTimeChange = basePrice > 0 ? ((price - basePrice) / basePrice) * 100 : null;

    // Only relevant when CHANGE_BASIS=session — API's 24h change, in basis points.
    const change24h = tok.changes?.['24h']?.changePercent;
    const sessionChange = change24h != null ? Number(change24h) / 100 : null;

    out.push({
      symbol: team.symbol,
      price,
      conference: normalizeConference(team.conference),
      logo: team.logo || null,
      allTimeChange,
      sessionChange,
    });
  }
  return out;
}

/* ============================================================
   3. FETCH / STATE
   ============================================================ */
let lastGoodTeams = null; // never render an empty bar — hold last good on failure

async function fetchPrices() {
  const params = new URLSearchParams({
    chainId: String(CONFIG.CHAIN_ID),
    limit: '200',
    offset: '0',
    market: CONFIG.MARKET,
  });
  if (CONFIG.TOKEN) params.set('token', CONFIG.TOKEN);

  const res = await fetch(`${CONFIG.INDEXER_BASE}/tokens?${params.toString()}`, {
    headers: { 'Content-Type': 'application/json' },
  });
  if (!res.ok) throw new Error(`indexer responded ${res.status}`);
  const json = await res.json();
  return mapApiResponse(json);
}

async function refresh() {
  try {
    const teams = await fetchPrices();
    if (teams.length === 0) throw new Error('empty response after mapping — check TEAM_BY_ADDRESS / adapter');
    lastGoodTeams = teams;
    setStale(false);
    render(teams);
    debugLog(teams, null);
  } catch (err) {
    setStale(true);
    debugLog(lastGoodTeams, err);
    // Deliberately do not touch the DOM here — last good tape stays on screen.
  }
}

function setStale(isStale) {}

/* ============================================================
   4. RENDER
   ============================================================ */
function groupAndSort(teams) {
  const byConf = new Map(CONFIG.CONFERENCE_ORDER.map(c => [c, []]));
  for (const t of teams) {
    if (byConf.has(t.conference)) byConf.get(t.conference).push(t);
  }
  for (const [, list] of byConf) {
    list.sort((a, b) =>
      CONFIG.SORT === 'symbol'
        ? a.symbol.localeCompare(b.symbol)
        : a.price - b.price
    );
  }
  return byConf;
}

function fmtPrice(p) {
  return `$${p.toFixed(2)}`;
}

function fmtDelta(pct) {
  if (pct == null || !Number.isFinite(pct)) return '—';
  const sign = pct > 0 ? '+' : '';
  return `${sign}${pct.toFixed(1)}%`;
}

function buildItemEl(team) {
  const el = document.createElement('div');
  el.className = 'ticker-item';

  if (!CONFIG.NO_LOGOS) {
    const img = document.createElement('img');
    img.className = 'logo';
    img.src = team.logo || `${CONFIG.LOGO_BASE}${team.symbol}${CONFIG.LOGO_EXT}`;
    img.alt = '';
    img.onerror = () => {
      const fallback = document.createElement('div');
      fallback.className = 'logo-fallback';
      fallback.textContent = team.symbol.slice(0, 3);
      img.replaceWith(fallback);
    };
    el.appendChild(img);
  }

  const symbol = document.createElement('span');
  symbol.className = 'symbol';
  symbol.textContent = team.symbol;
  el.appendChild(symbol);

  const price = document.createElement('span');
  price.className = 'price';
  price.textContent = fmtPrice(team.price);
  el.appendChild(price);

  const delta = document.createElement('span');
  const pct = CONFIG.CHANGE_BASIS === 'session' ? team.sessionChange : team.allTimeChange;
  delta.className = 'delta ' + (pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat');
  delta.textContent = fmtDelta(pct);
  el.appendChild(delta);

  return el;
}

function buildSegment(byConf) {
  const frag = document.createDocumentFragment();
  for (const conf of CONFIG.CONFERENCE_ORDER) {
    const list = byConf.get(conf) || [];
    if (list.length === 0) continue;
    const label = document.createElement('div');
    label.className = 'conf-label';

    const logoUrl = CONFIG.CONFERENCE_LOGOS[conf];
    if (!CONFIG.NO_LOGOS && logoUrl) {
      const img = document.createElement('img');
      img.className = 'conf-logo';
      img.src = logoUrl;
      img.alt = '';
      img.onerror = () => img.remove(); // fall back to text-only label
      label.appendChild(img);
    }

    const text = document.createElement('span');
    text.textContent = conf;
    label.appendChild(text);

    frag.appendChild(label);
    for (const team of list) frag.appendChild(buildItemEl(team));
  }
  return frag;
}

let animFrame = null;
let trackOffset = 0;
let segmentWidth = 0;

function render(teams) {
  const byConf = groupAndSort(teams);
  const track = document.getElementById('tape-track');
  const prevOffset = trackOffset % (segmentWidth || 1);

  track.innerHTML = '';
  // Two copies back-to-back so the loop has no visible seam; a third guards
  // against a slow frame briefly exposing the gap on very wide viewports.
  track.appendChild(buildSegment(byConf));
  segmentWidth = track.scrollWidth;
  track.appendChild(buildSegment(byConf));
  track.appendChild(buildSegment(byConf));

  // Preserve scroll position through a data refresh so the tape doesn't jump.
  trackOffset = segmentWidth > 0 ? prevOffset : 0;
}

function animate(ts) {
  if (!animate.last) animate.last = ts;
  const dt = (ts - animate.last) / 1000;
  animate.last = ts;

  if (segmentWidth > 0) {
    trackOffset += CONFIG.SPEED * dt;
    if (trackOffset >= segmentWidth) trackOffset -= segmentWidth;
    document.getElementById('tape-track').style.transform = `translateX(${-trackOffset}px)`;
  }
  animFrame = requestAnimationFrame(animate);
}

/* ============================================================
   5. DEBUG
   ============================================================ */
function debugLog(teams, err) {
  if (!CONFIG.DEBUG) return;
  const panel = document.getElementById('debug-panel');
  panel.style.display = 'block';

  const lines = [`stak3holder-ticker — ${new Date().toLocaleTimeString()}`];
  if (err) lines.push(`<span class="err">fetch error: ${escapeHtml(err.message)}</span>`);

  if (teams) {
    const byConf = groupAndSort(teams);
    for (const conf of CONFIG.CONFERENCE_ORDER) {
      const n = (byConf.get(conf) || []).length;
      lines.push(`${conf}: ${n} teams`);
    }
    const missingConf = teams.filter(t => !CONFIG.CONFERENCE_ORDER.includes(t.conference));
    if (missingConf.length) {
      lines.push(`<span class="warn">${missingConf.length} teams with unrecognized conference: ${missingConf.map(t => t.symbol).join(', ')}</span>`);
    }
    const missingBasis = teams.filter(t => t.allTimeChange == null);
    if (missingBasis.length) {
      lines.push(`<span class="warn">${missingBasis.length} teams missing all-time basis: ${missingBasis.map(t => t.symbol).join(', ')}</span>`);
    }
  } else {
    lines.push('<span class="warn">no data yet</span>');
  }
  panel.innerHTML = lines.join('\n');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   6. BOOT
   ============================================================ */
refresh();
setInterval(refresh, CONFIG.REFRESH_MS);
animFrame = requestAnimationFrame(animate);
</script>
</body>
</html>
