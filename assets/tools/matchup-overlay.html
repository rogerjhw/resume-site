<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Stak3holder Matchup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0c0e;
    --ink-2: #17181b;
    --paper: #f3f0e8;
    /* Light-background palette: this copy composites onto the portfolio's
       white page rather than a dark OBS scene, so --text/--text-dim/--rule
       are inverted from the on-air version (dark ink instead of pale cream,
       black-tinted rules instead of white-tinted ones). */
    --text: #14151a;
    --text-dim: #6b6b66;
    --up: #3f8a4b;
    --down: #c0392b;
    --rule: rgba(0, 0, 0, 0.1);
    --sans: "Space Grotesk", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* Fully transparent — page and card both — so this composites directly
     onto the background template/scene in OBS with no panel shape of its
     own; only the logos, type, and sparklines are opaque. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  #card {
    position: relative;
    width: 1980px;
    box-sizing: border-box;
    padding: 34px 58px;
    background: transparent;
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #status-dot {
    position: absolute;
    top: 15px;
    left: 58px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s ease;
  }
  #status-dot.stale { background: var(--down); }
  #status-dot { display: none; } /* label removed; JS still toggles .stale */

  #kicker {
    position: absolute;
    top: 13px;
    left: 72px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.16em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Per-side color wash, set inline via JS from the team's own brand color —
     same "team identity" cue the real site uses on its team-page hero art. */
  .team {
    position: relative;
    flex: 1 1 0;
    display: flex;
    align-items: center;
    gap: 26px;
    min-width: 0;
    padding: 6px 4px;
  }
  .team.away { flex-direction: row; }
  .team.home { flex-direction: row-reverse; text-align: right; }

  .logo-badge {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08), 0 10px 24px rgba(0, 0, 0, 0.35);
    background: var(--paper);
  }

  .team img.logo {
    width: 66px;
    height: 66px;
    object-fit: contain;
    flex: 0 0 auto;
  }
  .team .logo-fallback {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.06);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .team-info {
    min-width: 0;
    flex: 0 0 auto;
  }
  .team.home .team-info { display: flex; flex-direction: column; align-items: flex-end; }
  .team.away .team-info { display: flex; flex-direction: column; align-items: flex-start; }

  .pick-tag {
    display: none;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #0b0c0e;
    background: #f2c744;
    padding: 3px 9px;
    border-radius: 100px;
    margin-top: 6px;
  }
  .pick-tag.shown { display: inline-block; }

  .team-symbol {
    font-size: 38px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
    line-height: 1.2;
    margin-top: 0;
  }

  .team-price {
    font-family: var(--mono);
    font-size: 72px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    margin-top: 18px;
    display: block;
    line-height: 1;
  }

  .team-change {
    display: inline-block;
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 12px;
    white-space: nowrap;
  }
  .team-change.up { color: var(--up); }
  .team-change.down { color: var(--down); }
  .team-change.flat { color: var(--text-dim); }

  .sparkline {
    display: block;
    flex: 1 1 auto;
    min-width: 220px;
    height: 132px;
    align-self: center;
  }

  /* Final score takes the sparkline's place on a concluded game — same
     real estate, toggled via #card[data-state]. */
  .team-score-big {
    display: none;
    align-items: center;
    flex: 1 1 auto;
    min-width: 200px;
    height: 132px;
    font-family: var(--mono);
    font-size: 128px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text-dim);
  }
  .team-score-big.winner { color: var(--text); font-weight: 800; }
  .team.away .team-score-big { justify-content: flex-end; }
  .team.home .team-score-big { justify-content: flex-start; }

  #matchup-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 36px;
  }

  /* Single standout performer, pulled from ESPN's own passing/rushing/
     receiving leader — only shown once a game is final. */
  #star-player {
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 14px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-size: 20px;
  }
  #star-player.empty { display: none; }
  #star-tag {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  #star-name {
    font-weight: 700;
    font-size: 26px;
    color: var(--text);
  }
  #star-meta {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--text-dim);
  }
  #star-line {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  #center {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 30px;
    border-left: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
  }

  #vs {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: lowercase;
  }

  #kickoff-date {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: nowrap;
  }
  #kickoff-time {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    margin-top: 2px;
  }
  #network {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }
  #game-status {
    display: none;
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  #debug-panel {
    position: fixed;
    top: 16px;
    left: 16px;
    max-width: 480px;
    background: rgba(0,0,0,0.9);
    color: #d8ffea;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    padding: 10px 12px;
    border-radius: 6px;
    white-space: pre-wrap;
    z-index: 10;
  }
  #debug-panel .warn { color: #fbbf24; }
  #debug-panel .err { color: #f87171; }
</style>
</head>
<body>

<div id="card">
  <div id="status-dot"></div>

  <div id="matchup-row">
    <div class="team away" id="away-team">
      <div class="logo-badge" id="away-badge">
        <img class="logo" id="away-logo" alt="" />
      </div>
      <div class="team-info">
        <div class="team-symbol" id="away-symbol">—</div>
        <span class="team-price" id="away-price">—</span>
        <span class="team-change flat" id="away-change">—</span>
        <span class="pick-tag" id="away-pick"></span>
      </div>
      <svg class="sparkline" id="away-sparkline" viewBox="0 0 230 108" preserveAspectRatio="none"></svg>
      <div class="team-score-big" id="away-score-big"></div>
    </div>

    <div id="center">
      <div id="vs">at</div>
      <div id="kickoff-date">Waiting for matchup</div>
      <div id="kickoff-time"></div>
      <div id="network"></div>
      <div id="game-status"></div>
    </div>

    <div class="team home" id="home-team">
      <div class="logo-badge" id="home-badge">
        <img class="logo" id="home-logo" alt="" />
      </div>
      <div class="team-info">
        <div class="team-symbol" id="home-symbol">—</div>
        <span class="team-price" id="home-price">—</span>
        <span class="team-change flat" id="home-change">—</span>
        <span class="pick-tag" id="home-pick"></span>
      </div>
      <svg class="sparkline" id="home-sparkline" viewBox="0 0 230 108" preserveAspectRatio="none"></svg>
      <div class="team-score-big" id="home-score-big"></div>
    </div>
  </div>

  <div id="star-player" class="empty">
    <span id="star-tag">Star</span>
    <span id="star-name"></span>
    <span id="star-meta"></span>
    <span id="star-line"></span>
  </div>
</div>
<div id="debug-panel" style="display:none;"></div>

<script>
/* ============================================================
   1. CONFIG
   ------------------------------------------------------------
   This is the on-air display. It has no picker UI — the matchup is
   driven either by URL params (?away=&home=, for a static/manual OBS
   source) or, preferably, by the relay server + control panel
   (stak3holder-matchup-control.html), which lets a producer queue up
   games live without touching this page or the URL.
   ============================================================ */
const qs = new URLSearchParams(location.search);

const CONFIG = {
  AWAY: (qs.get('away') || '').toUpperCase(),
  HOME: (qs.get('home') || '').toUpperCase(),
  WEEK: qs.get('week') ? Number(qs.get('week')) : null,
  YEAR: qs.get('year') ? Number(qs.get('year')) : null,
  AWAY_PICK: '',
  HOME_PICK: '',
  DEBUG: qs.get('debug') === '1',

  REFRESH_MS: 30_000,
  RELAY_POLL_MS: 2_000,

  // by relay-server.js, e.g. as an OBS Browser Source pointed at

  RELAY_BASE: qs.get('relay') || (location.protocol === 'file:' ? 'http://localhost:8787' : ''),

  LOGO_EXT: '.png',

  CHAIN_ID: 42161,

/* ============================================================
   2. ADAPTER
   ------------------------------------------------------------
   The /tokens response has no "since launch" field — its `changes`
   object only covers 1h/24h/7d/3m. Launch price lives in the static
   TEAM_CATALOG (copied from the app's cfb-config.json), so the
   since-launch delta is computed here from live price vs. that
   embedded launch price, not from the API.
   `createdAt` (the token's actual on-chain creation time) drives how
   far back the sparkline reaches — a true "since launch" chart rather
   than a fixed lookback window.
   ============================================================ */
function mapPriceResponse(json, wantedAddresses) {
  const tokens = Array.isArray(json?.tokens) ? json.tokens : [];
  const byAddress = new Map();
  for (const tok of tokens) {
    const address = String(tok.address || '').toLowerCase();
    if (!wantedAddresses.has(address)) continue;
    const price = Number(tok.price) / 1e6;
    const createdAt = tok.createdAt != null ? Number(tok.createdAt) : null;
    byAddress.set(address, { price, createdAt });
  }
  return byAddress;
}

function sinceLaunch(price, launchPriceRaw) {
  const basePrice = (launchPriceRaw || 0) / 1e6;
  if (!(basePrice > 0) || price == null) return { pct: null, dollar: null };
  return { pct: ((price - basePrice) / basePrice) * 100, dollar: price - basePrice };
}

/* ============================================================
   3. FETCH — price, sparkline, kickoff
   ============================================================ */
async function fetchPrices(addresses) {
  const params = new URLSearchParams({
    chainId: String(CONFIG.CHAIN_ID),
    limit: '200',
    offset: '0',
    market: CONFIG.MARKET,
  });
  const res = await fetch(`${CONFIG.INDEXER_BASE}/tokens?${params.toString()}`);
  if (!res.ok) throw new Error(`indexer /tokens responded ${res.status}`);
  const json = await res.json();
  return mapPriceResponse(json, new Set(addresses));
}

async function fetchSparkline(tokenAddress, startTimeSeconds) {
  // startTimeSeconds is the token's actual createdAt (launch) when known,
  // so this is a true since-launch chart; the fixed lookback is only a
  // fallback for the rare case price fetch failed and createdAt is unknown.
  const startTime = startTimeSeconds ?? (Math.floor(Date.now() / 1000) - CONFIG.SPARK_LOOKBACK_DAYS * 86400);
  const bucketField = { bucket1m: 'bucket1ms', bucket5m: 'bucket5ms', bucket1h: 'bucket1hs', bucket12h: 'bucket12hs', bucket7d: 'bucket7ds' }[CONFIG.SPARK_BUCKET];

  const query = `
    query($tokenAddress: String!, $chainId: Int!, $startTime: BigInt!) {
      ${bucketField}(
        where: { tokenAddress: $tokenAddress, chainId: $chainId, timeBucketId_gt: $startTime }
        orderBy: "timeBucketId"
        orderDirection: "asc"
        limit: 1000
      ) {
        items { timeBucketId close }
      }
    }
  `;

  const res = await fetch(CONFIG.INDEXER_BASE + '/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      query,
      variables: { tokenAddress: tokenAddress.toLowerCase(), chainId: CONFIG.CHAIN_ID, startTime: String(startTime) },
    }),
  });
  if (!res.ok) throw new Error(`indexer graphql responded ${res.status}`);
  const json = await res.json();
  if (json.errors?.length) throw new Error(json.errors.map(e => e.message).join(', '));

  const items = json.data?.[bucketField]?.items || [];
  return items.map(it => Number(it.close) / 1e6).filter(Number.isFinite);
}

// One lookup covers both states this card can be in: an upcoming game
// (date/time/network, sparkline showing price history) or a concluded one
// (final score, star performer, no sparkline). `completed` + both scores
// present is what the render layer uses to decide which state to show.
const LEADER_CATEGORY_PRIORITY = ['passingYards', 'rushingYards', 'receivingYards'];

async function fetchGameInfo(awaySymbol, homeSymbol) {
  const mocked = MOCK_GAMES[`${awaySymbol}-${homeSymbol}`];
  if (mocked) return mocked;

  const params = new URLSearchParams({ groups: '80' });
  if (CONFIG.WEEK) params.set('week', String(CONFIG.WEEK));
  if (CONFIG.YEAR) params.set('year', String(CONFIG.YEAR));

  const res = await fetch(`${CONFIG.ESPN_SCOREBOARD}?${params.toString()}`);
  if (!res.ok) throw new Error(`ESPN scoreboard responded ${res.status}`);
  const json = await res.json();
  const events = Array.isArray(json?.events) ? json.events : [];

  for (const ev of events) {
    const comp = ev.competitions?.[0];
    const competitors = comp?.competitors || [];
    const awayC = competitors.find(c => c.homeAway === 'away');
    const homeC = competitors.find(c => c.homeAway === 'home');
    if (!awayC || !homeC) continue;
    if (awayC.team?.abbreviation !== awaySymbol || homeC.team?.abbreviation !== homeSymbol) continue;

    const completed = !!ev.status?.type?.completed;
    return {
      date: ev.date,
      completed,
      statusDetail: ev.status?.type?.shortDetail || ev.status?.type?.detail || null,
      tbd: !!ev.status?.type?.name?.includes('TBD'),
      network: comp.broadcasts?.[0]?.names?.[0] || comp.geoBroadcasts?.[0]?.media?.shortName || null,
      awayScore: awayC.score != null && awayC.score !== '' ? Number(awayC.score) : null,
      homeScore: homeC.score != null && homeC.score !== '' ? Number(homeC.score) : null,
      leader: completed ? pickGameLeader(comp?.leaders, awayC.team?.id, homeC.team?.id) : null,
    };
  }
  return null;
}

// ESPN's scoreboard payload already computes one game-wide leader per
// category (not per team) — pick the highest-priority category that has
// one, and use its athlete's own team id to say which side they're on.
function pickGameLeader(leaders, awayTeamId, homeTeamId) {
  if (!Array.isArray(leaders)) return null;
  const byCategory = new Map(leaders.map(l => [l.name, l]));

  for (const category of LEADER_CATEGORY_PRIORITY) {
    const entry = byCategory.get(category);
    const leader = entry?.leaders?.[0];
    if (!leader?.athlete) continue;

    const teamId = leader.team?.id;
    const side = teamId === awayTeamId ? 'away' : teamId === homeTeamId ? 'home' : null;
    if (!side) continue;

    return {
      side,
      name: leader.athlete.shortName || leader.athlete.displayName,
      position: leader.athlete.position?.abbreviation || '',
      statLine: leader.displayValue,
      categoryLabel: entry.shortDisplayName || entry.displayName || '',
    };
  }
  return null;
}

/* ============================================================
   4. RENDER
   ============================================================ */
function fmtPrice(p) {
  return p == null ? 'N/A' : `$${p.toFixed(2)}`;
}

// Combined "▲ +$0.42 (+12.3%)" format, matching the real site's team-page
// delta line (dollar diff + percent, both signed, one colored unit).
function fmtChangeCombined(pct, dollar) {
  if (pct == null || dollar == null || !Number.isFinite(pct)) return { text: 'N/A', dir: 'flat' };
  const dir = pct > 0.05 ? 'up' : pct < -0.05 ? 'down' : 'flat';
  const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
  const sign = dollar > 0 ? '+' : dollar < 0 ? '−' : '';
  return { text: `${arrow} ${sign}$${Math.abs(dollar).toFixed(2)} (${sign}${Math.abs(pct).toFixed(1)}%)`, dir };
}

function renderSide(side, team, priceInfo, sparkPoints) {
  const logoImg = document.getElementById(`${side}-logo`);
  const brand = team?.primary || '#8a867e';
  const tint = brand;

  if (team?.logo) {
    logoImg.src = team.logo;
    logoImg.style.display = '';
    logoImg.onerror = () => { logoImg.style.display = 'none'; };
  } else {
    logoImg.style.display = 'none';
  }

  document.getElementById(`${side}-symbol`).textContent = team?.symbol || (side === 'home' ? CONFIG.HOME : CONFIG.AWAY) || '—';

  // Price is the focal numeral on each side, so it carries a whisper of the
  // team's own brand color rather than plain white — ties the number back
  // to the identity the logo and sparkline are already using.
  const priceEl = document.getElementById(`${side}-price`);
  priceEl.textContent = fmtPrice(priceInfo?.price);
  priceEl.style.color = tint;

  const { pct, dollar } = team ? sinceLaunch(priceInfo?.price, team.launchPrice) : { pct: null, dollar: null };
  const changeEl = document.getElementById(`${side}-change`);
  const fmt = fmtChangeCombined(pct, dollar);
  changeEl.textContent = fmt.text;
  changeEl.className = 'team-change ' + fmt.dir;

  renderSparkline(document.getElementById(`${side}-sparkline`), sparkPoints, tint);
}

// Centered moving average — knocks the per-bucket noise down before curving,
// so the line reads as a trend rather than a jagged EKG.
function movingAverage(points, window) {
  if (points.length <= window) return points.slice();
  const half = Math.floor(window / 2);
  return points.map((_, i) => {
    const lo = Math.max(0, i - half);
    const hi = Math.min(points.length, i + half + 1);
    const slice = points.slice(lo, hi);
    return slice.reduce((a, b) => a + b, 0) / slice.length;
  });
}

// Resamples to a fixed point count so curve density doesn't depend on how
// many buckets came back.
function resample(points, count) {
  if (points.length <= count) return points.slice();
  const out = [];
  for (let i = 0; i < count; i++) {
    const pos = (i / (count - 1)) * (points.length - 1);
    const lo = Math.floor(pos), hi = Math.ceil(pos);
    out.push(lo === hi ? points[lo] : points[lo] + (points[hi] - points[lo]) * (pos - lo));
  }
  return out;
}

// Catmull-Rom -> cubic Bezier, so the line curves smoothly through each
// point instead of bending sharply at every sample.
function smoothPathD(coords) {
  if (coords.length < 3) return `M ${coords.map(c => c.join(',')).join(' L ')}`;
  let d = `M ${coords[0][0].toFixed(1)},${coords[0][1].toFixed(1)}`;
  for (let i = 0; i < coords.length - 1; i++) {
    const p0 = coords[i - 1] || coords[i];
    const p1 = coords[i];
    const p2 = coords[i + 1];
    const p3 = coords[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

// The sparkline is the dominant visual on each side now, not a footnote —
// a filled gradient area under a thin line, the way a terminal price chart
// reads, rather than a bare stroke floating in whitespace.
function renderSparkline(svg, rawPoints, lineColor) {
  svg.innerHTML = '';
  if (!rawPoints || rawPoints.length < 2) return;

  const svgNS = 'http://www.w3.org/2000/svg';
  const smoothed = resample(movingAverage(rawPoints, 5), 48);

  const w = 230, h = 108, padX = 4, padTop = 12, padBottom = 10;
  const min = Math.min(...smoothed);
  const max = Math.max(...smoothed);
  const range = max - min || 1;

  const coords = smoothed.map((p, i) => [
    padX + (i / (smoothed.length - 1)) * (w - padX * 2),
    padTop + (1 - (p - min) / range) * (h - padTop - padBottom),
  ]);

  const gradId = `${svg.id}-fill`;
  const defs = document.createElementNS(svgNS, 'defs');
  const grad = document.createElementNS(svgNS, 'linearGradient');
  grad.setAttribute('id', gradId);
  grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
  grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
  const stopTop = document.createElementNS(svgNS, 'stop');
  stopTop.setAttribute('offset', '0%');
  stopTop.setAttribute('stop-color', lineColor);
  stopTop.setAttribute('stop-opacity', '0.28');
  const stopBottom = document.createElementNS(svgNS, 'stop');
  stopBottom.setAttribute('offset', '100%');
  stopBottom.setAttribute('stop-color', lineColor);
  stopBottom.setAttribute('stop-opacity', '0');
  grad.appendChild(stopTop);
  grad.appendChild(stopBottom);
  defs.appendChild(grad);
  svg.appendChild(defs);

  const lineD = smoothPathD(coords);
  const areaD = `${lineD} L ${coords[coords.length - 1][0].toFixed(1)},${h} L ${coords[0][0].toFixed(1)},${h} Z`;

  const area = document.createElementNS(svgNS, 'path');
  area.setAttribute('d', areaD);
  area.setAttribute('fill', `url(#${gradId})`);
  area.setAttribute('stroke', 'none');
  svg.appendChild(area);

  const line = document.createElementNS(svgNS, 'path');
  line.setAttribute('d', lineD);
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke', lineColor);
  line.setAttribute('stroke-width', '3');
  line.setAttribute('stroke-linejoin', 'round');
  line.setAttribute('stroke-linecap', 'round');
  svg.appendChild(line);
}

// Toggles the whole card between its two states: an upcoming game (date/
// time/network + sparkline) or a concluded one (final score + star
// performer, no sparkline). `isFinal` is decided by the caller in refresh().
function renderGameInfo(gameInfo, isFinal) {
  const dateEl = document.getElementById('kickoff-date');
  const timeEl = document.getElementById('kickoff-time');
  const netEl = document.getElementById('network');
  const statusEl = document.getElementById('game-status');
  const vsEl = document.getElementById('vs');
  const awayScoreEl = document.getElementById('away-score-big');
  const homeScoreEl = document.getElementById('home-score-big');
  const awaySparkEl = document.getElementById('away-sparkline');
  const homeSparkEl = document.getElementById('home-sparkline');
  const starEl = document.getElementById('star-player');

  document.getElementById('card').dataset.state = isFinal ? 'final' : 'preview';
  vsEl.textContent = isFinal ? 'final' : 'at';

  timeEl.style.display = isFinal ? 'none' : 'block';
  netEl.style.display = isFinal ? 'none' : 'block';
  statusEl.style.display = isFinal ? 'block' : 'none';
  awaySparkEl.style.display = isFinal ? 'none' : 'block';
  homeSparkEl.style.display = isFinal ? 'none' : 'block';
  awayScoreEl.style.display = isFinal ? 'flex' : 'none';
  homeScoreEl.style.display = isFinal ? 'flex' : 'none';

  if (!gameInfo) {
    dateEl.textContent = isFinal ? 'No result yet' : 'Kickoff TBD';
    timeEl.textContent = '';
    netEl.textContent = '';
    statusEl.textContent = '';
    awayScoreEl.textContent = '';
    homeScoreEl.textContent = '';
    awayScoreEl.className = 'team-score-big';
    homeScoreEl.className = 'team-score-big';
    starEl.classList.add('empty');
    return;
  }

  const d = new Date(gameInfo.date);
  dateEl.textContent = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

  if (isFinal) {
    statusEl.textContent = gameInfo.statusDetail || 'Final';
    awayScoreEl.textContent = String(gameInfo.awayScore);
    homeScoreEl.textContent = String(gameInfo.homeScore);
    const awayWon = gameInfo.awayScore > gameInfo.homeScore;
    const homeWon = gameInfo.homeScore > gameInfo.awayScore;
    awayScoreEl.className = 'team-score-big' + (awayWon ? ' winner' : '');
    homeScoreEl.className = 'team-score-big' + (homeWon ? ' winner' : '');
    renderStarPlayer(gameInfo.leader);
  } else {
    timeEl.textContent = gameInfo.tbd ? 'TBD' : d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    netEl.textContent = gameInfo.network || '';
    starEl.classList.add('empty');
  }
}

function renderPick(side, name) {
  const el = document.getElementById(`${side}-pick`);
  if (name) {
    el.textContent = `${name}'s pick`;
    el.classList.add('shown');
  } else {
    el.textContent = '';
    el.classList.remove('shown');
  }
}

function renderStarPlayer(leader) {
  const starEl = document.getElementById('star-player');
  if (!leader) {
    starEl.classList.add('empty');
    return;
  }
  starEl.classList.remove('empty');

  const sideSymbol = leader.side === 'away' ? CONFIG.AWAY : CONFIG.HOME;
  document.getElementById('star-name').textContent = leader.name;
  document.getElementById('star-meta').textContent =
    [leader.position, sideSymbol].filter(Boolean).join(' · ');
  document.getElementById('star-line').textContent =
    leader.categoryLabel ? `${leader.categoryLabel} — ${leader.statLine}` : leader.statLine;
}

/* ============================================================
   5. DEBUG
   ============================================================ */
function debugLog(state) {
  if (!CONFIG.DEBUG) return;
  const panel = document.getElementById('debug-panel');
  panel.style.display = 'block';
  const lines = [`stak3holder-matchup — ${new Date().toLocaleTimeString()}`];
  lines.push(`away=${CONFIG.AWAY} home=${CONFIG.HOME} relay=${CONFIG.RELAY_BASE || '(same-origin)'} relayOk=${relayAvailable}`);
  for (const [label, val] of Object.entries(state)) {
    if (val instanceof Error) lines.push(`<span class="err">${label}: ${escapeHtml(val.message)}</span>`);
    else lines.push(`${label}: ${escapeHtml(JSON.stringify(val))}`);
  }
  panel.innerHTML = lines.join('\n');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setStale(isStale) {
  document.getElementById('status-dot').classList.toggle('stale', isStale);
}

/* ============================================================
   6. RELAY POLLING
   ------------------------------------------------------------
   Picks up the producer's current selection from relay-server.js. Polls
   fast (2s) since this is just a cheap same-machine JSON fetch, separate
   from the 30s price/sparkline/kickoff refresh cycle.
   ============================================================ */
let relayAvailable = false;

async function pollRelay() {
  try {
    const res = await fetch(`${CONFIG.RELAY_BASE}/api/current`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`relay responded ${res.status}`);
    const data = await res.json();
    relayAvailable = true;

    const away = String(data.away || '').toUpperCase();
    const home = String(data.home || '').toUpperCase();
    if (!away || !home) return; // relay is up but producer hasn't picked a game yet

    const changed = away !== CONFIG.AWAY || home !== CONFIG.HOME || data.week !== CONFIG.WEEK || data.year !== CONFIG.YEAR;
    if (changed) {
      CONFIG.AWAY = away;
      CONFIG.HOME = home;
      CONFIG.WEEK = data.week ?? null;
      CONFIG.YEAR = data.year ?? null;
      lastGood = null; // new matchup — don't hold over the previous one's data
      refresh();
    }

    const awayPick = String(data.awayPick || '');
    const homePick = String(data.homePick || '');
    if (awayPick !== CONFIG.AWAY_PICK || homePick !== CONFIG.HOME_PICK) {
      CONFIG.AWAY_PICK = awayPick;
      CONFIG.HOME_PICK = homePick;
      renderPick('away', awayPick);
      renderPick('home', homePick);
    }
  } catch (err) {
    relayAvailable = false;
  }
}

/* ============================================================
   7. BOOT
   ============================================================ */
let lastGood = null; // hold last good render on a failed refresh, same as the ticker
let announcedReady = false; // fires the postMessage below at most once per page load

async function refresh() {
  if (!CONFIG.AWAY || !CONFIG.HOME) return;

  const awayTeam = TEAM_BY_SYMBOL.get(CONFIG.AWAY) || null;
  const homeTeam = TEAM_BY_SYMBOL.get(CONFIG.HOME) || null;
  const addresses = [awayTeam?.tokenAddress, homeTeam?.tokenAddress].filter(Boolean);

  const debugState = {};

  try {
    // Price first — its createdAt (real launch time) sets how far back each
    // sparkline should reach, so it has to resolve before the spark fetches.
    const priceByAddress = addresses.length ? await fetchPrices(addresses) : new Map();
    const awayPrice = awayTeam ? priceByAddress.get(awayTeam.tokenAddress) : null;
    const homePrice = homeTeam ? priceByAddress.get(homeTeam.tokenAddress) : null;

    const gameInfo = await fetchGameInfo(CONFIG.AWAY, CONFIG.HOME).catch(e => { debugState.gameInfoError = e; return null; });
    const isFinal = !!(gameInfo?.completed && gameInfo.awayScore != null && gameInfo.homeScore != null);

    // Skip the price-history fetch entirely once a game is final — the
    // sparkline is hidden in that state, so there's nothing to draw it for.
    const [awaySpark, homeSpark] = isFinal
      ? [[], []]
      : await Promise.all([
          awayTeam ? fetchSparkline(awayTeam.tokenAddress, awayPrice?.createdAt).catch(e => { debugState.awaySparkError = e; return []; }) : Promise.resolve([]),
          homeTeam ? fetchSparkline(homeTeam.tokenAddress, homePrice?.createdAt).catch(e => { debugState.homeSparkError = e; return []; }) : Promise.resolve([]),
        ]);

    lastGood = { awayTeam, homeTeam, awayPrice, homePrice, awaySpark, homeSpark, gameInfo, isFinal };
    setStale(false);
  } catch (err) {
    debugState.fetchError = err;
    setStale(true);
    if (!lastGood) return;
  }

  renderSide('away', lastGood.awayTeam, lastGood.awayPrice, lastGood.awaySpark);
  renderSide('home', lastGood.homeTeam, lastGood.homePrice, lastGood.homeSpark);
  renderGameInfo(lastGood.gameInfo, lastGood.isFinal);
  renderPick('away', CONFIG.AWAY_PICK);
  renderPick('home', CONFIG.HOME_PICK);

  debugState.awayPrice = lastGood.awayPrice;
  debugState.homePrice = lastGood.homePrice;
  debugState.gameInfo = lastGood.gameInfo;
  debugState.isFinal = lastGood.isFinal;
  debugLog(debugState);

  // Tell an embedding page (e.g. a portfolio site cross-fading between
  // matchups) the instant real data has actually rendered, rather than
  // making it guess how long the price/game-info fetch takes.
  if (!announcedReady) {
    announcedReady = true;
    try { window.parent.postMessage({ type: 'stak3holder-matchup-ready', away: CONFIG.AWAY, home: CONFIG.HOME }, '*'); } catch (e) {}
  }
}

// Relay polling (pollRelay) is intentionally not started here — this
// portfolio copy is driven purely by the away/home URL params, and
// polling a producer's relay/control-panel server would otherwise
// silently overwrite that matchup out from under it.
refresh();
setInterval(refresh, CONFIG.REFRESH_MS);
</script>
